<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">Mock generation artifact</title>
  <description id="description">A cyan paper plane on a dark grid used to verify the generation job workflow without calling a paid model.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07151c"/>
      <stop offset="1" stop-color="#102b34"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#1e5664" stroke-width="2" opacity=".45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#background)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>
  <circle cx="600" cy="530" r="300" fill="#0dd3ee" opacity=".08"/>
  <path d="M286 575 944 328 708 876 572 650 420 734Z" fill="#22d3ee" filter="url(#glow)"/>
  <path d="m572 650 372-322-474 254Z" fill="#a5f3fc" opacity=".92"/>
  <path d="m572 650 136 226 42-356Z" fill="#0891b2"/>
  <rect x="334" y="970" width="532" height="92" rx="46" fill="#061116" stroke="#22d3ee" stroke-width="3"/>
  <text x="600" y="1029" fill="#a5f3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="5">MOCK ARTIFACT · $0</text>
</svg>
